<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | MySchoolInfo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <div class="max-w-4xl mx-auto py-12 px-4">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900"><i class="fa-solid fa-sliders mr-2"></i> Admin Panel</h1>
            <a href="index.html" class="bg-blue-600 text-white font-semibold px-4 py-2 rounded-xl text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i> Saytga qaytish
            </a>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- O'qituvchi Qo'shish -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-4 text-slate-900"><i class="fa-solid fa-user-plus text-blue-600 mr-2"></i> Yangi O'qituvchi</h2>
                <form id="teacher-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">F.I.SH</label>
                        <input type="text" id="t-name" required class="w-full border rounded-xl p-3 text-sm focus:outline-blue-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Fani / Mutaxassisligi</label>
                        <input type="text" id="t-subject" required class="w-full border rounded-xl p-3 text-sm focus:outline-blue-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Rasm URL-manzili</label>
                        <input type="url" id="t-image" placeholder="https://..." required class="w-full border rounded-xl p-3 text-sm focus:outline-blue-600">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
                        Qo'shish
                    </button>
                </form>
            </div>

            <!-- Yangilik Qo'shish -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-4 text-slate-900"><i class="fa-solid fa-newspaper text-amber-500 mr-2"></i> Yangilik Qo'shish</h2>
                <form id="news-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Sarlavha</label>
                        <input type="text" id="n-title" required class="w-full border rounded-xl p-3 text-sm focus:outline-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Sana</label>
                        <input type="text" id="n-date" placeholder="Masalan: 14 Sentyabr, 2026" required class="w-full border rounded-xl p-3 text-sm focus:outline-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Rasm URL-manzili</label>
                        <input type="url" id="n-image" placeholder="https://..." required class="w-full border rounded-xl p-3 text-sm focus:outline-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tavsif</label>
                        <textarea id="n-desc" rows="3" required class="w-full border rounded-xl p-3 text-sm focus:outline-amber-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition">
                        Chop Etish
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Form Boshqaruvi va LocalStorage'ga Saqlash
        document.getElementById('teacher-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('t-name').value;
            const subject = document.getElementById('t-subject').value;
            const image = document.getElementById('t-image').value;

            const teachers = JSON.parse(localStorage.getItem('teachers')) || [];
            teachers.unshift({ name, subject, image });
            localStorage.setItem('teachers', JSON.stringify(teachers));

            alert("O'qituvchi muvaffaqiyatli qo'shildi!");
            e.target.reset();
        });

        document.getElementById('news-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('n-title').value;
            const date = document.getElementById('n-date').value;
            const image = document.getElementById('n-image').value;
            const desc = document.getElementById('n-desc').value;

            const news = JSON.parse(localStorage.getItem('news')) || [];
            news.unshift({ title, date, image, desc });
            localStorage.setItem('news', JSON.stringify(news));

            alert("Yangilik chop etildi!");
            e.target.reset();
        });
    </script>
</body>
</html>
